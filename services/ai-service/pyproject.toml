[project]
name = "ai-service"
version = "0.1.0"
description = "FastAPI AI Engine for LLM Inference, RAG, and Embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "openai>=1.35.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
