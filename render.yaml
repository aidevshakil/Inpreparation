services:
  # ==========================================
  # 1. Python AI Service (FastAPI)
  # ==========================================
  - type: web
    name: inpreparation-ai-service
    runtime: python
    rootDir: services/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ==========================================
  # 2. Node.js API Backend (Express + Prisma)
  # ==========================================
  - type: web
    name: inpreparation-api-backend
    runtime: node
    rootDir: .
    buildCommand: pnpm install --prod=false && pnpm run db:generate && pnpm run build --filter=@service/api-backend...
    startCommand: pnpm run db:push && node services/api-backend/dist/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: inpreparation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_SERVICE_URL
        sync: false

  # ==========================================
  # 3. React Web Frontend (Vite Static Site)
  # ==========================================
  - type: web
    name: inpreparation-web
    runtime: static
    rootDir: .
    buildCommand: pnpm run build --filter=@app/web...
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # Render এ Backend API ডিপ্লয় হলে তার URL (e.g. https://inpreparation-api-backend.onrender.com/api)
      - key: VITE_AI_SERVICE_URL
        sync: false # Render এ AI Service ডিপ্লয় হলে তার URL (e.g. https://inpreparation-ai-service.onrender.com/api/v1)

# ==========================================
# Managed PostgreSQL Database
# ==========================================
databases:
  - name: inpreparation-db
    databaseName: inpreparation
    user: inprep_admin
    plan: free
